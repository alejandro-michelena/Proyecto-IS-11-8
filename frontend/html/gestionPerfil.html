<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VITA-SUPPS - Mi Perfil</title>
    <link rel="stylesheet" href="/styles/catalogo.css">
    <link rel="stylesheet" href="/styles/perfil.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="admin-wrapper">
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="icono-logo"><i class="fa-solid fa-leaf"></i></div>
                    <h1 class="texto-logo">VITA-SUPPS</h1>
                </div>
                <div class="admin-profile">
                    <i class="fa-solid fa-user-tie profile-icon"></i>
                    <span class="admin-name">Cargando...</span>
                </div>
            </div>
            <ul class="sidebar-menu">
                <li class="menu-item" id="menu-catalogo"><a href="catalogo.html"><i class="fa-solid fa-cube"></i> Catálogo</a></li>
                <li class="menu-item" id="menu-agregar"><a href="agregar-producto.html"><i class="fa-solid fa-plus-circle"></i> Agregar Producto</a></li>
                <li class="menu-item" id="menu-pedidos"><a href="gestionPedidos.html"><i class="fa-solid fa-list-check"></i> Pedidos</a></li>
                <li class="menu-item active" id="menu-perfil"><a href="#"><i class="fa-solid fa-user"></i> Mi Perfil</a></li>
                <li class="menu-item" id="menu-carrito" id="menu-carrito"><a href="#"><i class="fa-solid fa-shopping-cart"></i> Ver Carrito</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="index.html" class="logout-button" id="btn-cerrar-sesion">
                    <i class="fa-solid fa-sign-out-alt"></i> Cerrar Sesión
                </a>
            </div>
        </nav>

        <main class="main-content">
            <header class="cabecera-perfil">
                <h1 class="titulo-pagina">Mi Perfil</h1>
                <p class="subtitulo-pagina">Consulta la información de tu cuenta activa en la plataforma.</p>
            </header>

            <section class="contenedor-tarjeta-perfil">
                <div class="tarjeta-premium-perfil">
                    <div class="avatar-perfil-seccion">
                        <div class="circulo-avatar">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <h2 id="perfil-nombre">Cargando...</h2>
                        <span class="badge-rol-perfil" id="perfil-rol-badge">CLIENTE</span>
                    </div>

                    <div class="bloque-detalles-usuario">
                        <div class="fila-detalle">
                            <div class="icono-detalle-perfil"><i class="fa-solid fa-envelope"></i></div>
                            <div class="datos-detalle-perfil">
                                <span class="etiqueta-perfil">Correo Electrónico</span>
                                <span class="valor-perfil" id="perfil-email">---</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="/js/persistenciaCliente.js"></script> 
    <script src="/elementosJS/sidebarController.js"></script>
    <script src="/logica/usuario/UsuarioModel.js"></script>
    <script src="/logica/usuario/UsuarioController.js"></script>
</body>
</html>
