<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VITA-SUPPS - Registro</title>
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="contenedor-pantalla">
        <div class="contenedor-logo">
            <div class="icono-logo"><i class="fa-solid fa-leaf"></i></div>
            <h1 class="texto-logo">VITA-SUPPS</h1>
        </div>
        <div class="tarjeta-login">
            <h2 class="titulo-login">Crear Cuenta</h2>
            <form class="formulario-login">
                <div class="grupo-formulario">
                    <label for="registro-nombre" class="etiqueta">Nombre Completo</label>
                    <div class="contenedor-entrada">
                        <i class="fa-solid fa-id-card icono-izquierdo"></i>
                        <input type="text" id="registro-nombre" class="campo-entrada" placeholder="Nombre Apellido" required>
                    </div>
                </div>
                <div class="grupo-formulario">
                    <label for="registro-email" class="etiqueta">Correo Electrónico</label>
                    <div class="contenedor-entrada">
                        <i class="fa-solid fa-envelope icono-izquierdo"></i>
                        <input type="email" id="registro-email" class="campo-entrada" placeholder="correo@est.ucab.edu.ve" required>
                    </div>
                </div>
                <div class="grupo-formulario">
                    <label for="registro-password" class="etiqueta">Contraseña</label>
                    <div class="contenedor-entrada">
                        <i class="fa-solid fa-lock icono-izquierdo"></i>
                        <input type="password" id="registro-password" class="campo-entrada" placeholder="Crea una contraseña" required>
                        <i class="fa-regular fa-eye icono-derecho" id="toggle-reg-password" style="cursor:pointer;"></i>
                    </div>
                </div>
                <button type="submit" id="btn-registrar" class="boton-iniciar">Registrar Usuario</button>
            </form>
            <div class="enlaces-acciones" style="justify-content:center;">
                <a href="index.html" class="enlace">¿Ya tienes cuenta? Inicia sesión aquí</a>
            </div>
        </div>
    </main>
    <script src="/js/persistenciaCliente.js"></script>
    <script src="/logica/usuario/UsuarioModel.js"></script>
    <script src="/logica/usuario/UsuarioController.js"></script>
    <script>
        document.getElementById('toggle-reg-password')?.addEventListener('click', () => {
            const input = document.getElementById('registro-password');
            const icon  = document.getElementById('toggle-reg-password');
            if (input.type === 'password') { input.type = 'text'; icon.classList.replace('fa-eye','fa-eye-slash'); }
            else { input.type = 'password'; icon.classList.replace('fa-eye-slash','fa-eye'); }
        });
    </script>
</body>
</html>
