<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VITA-SUPPS - Catálogo</title>
    <link rel="stylesheet" href="/styles/catalogo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="admin-wrapper">
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="icono-logo"><i class="fa-solid fa-leaf"></i></div>
                    <h1 class="texto-logo">VITA-SUPPS</h1>
                </div>
                <div class="admin-profile">
                    <i class="fa-solid fa-user-tie profile-icon"></i>
                    <span class="admin-name">Admin</span>
                </div>
            </div>
            <ul class="sidebar-menu">
                <li class="menu-item active" id="menu-catalogo"><a href="#"><i class="fa-solid fa-cube"></i> Catálogo</a></li>
                <li class="menu-item" id="menu-agregar"><a href="agregar-producto.html"><i class="fa-solid fa-plus-circle"></i> Agregar Producto</a></li>
                <li class="menu-item" id="menu-pedidos"><a href="gestionPedidos.html"><i class="fa-solid fa-list-check"></i> Pedidos</a></li>
                <li class="menu-item" id="menu-perfil"><a href="gestionPerfil.html"><i class="fa-solid fa-user"></i> Mi Perfil</a></li>
                <li class="menu-item" id="menu-carrito"><a href="#"><i class="fa-solid fa-shopping-cart"></i> Ver Carrito</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="index.html" class="logout-button" id="btn-cerrar-sesion">
                    <i class="fa-solid fa-sign-out-alt"></i> Cerrar Sesión
                </a>
            </div>
        </nav>
        <main class="main-content">
            <div class="contenedor-catalogo">
                <header class="cabecera-catalogo" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                    <h1 class="titulo-pagina" style="margin:0;">Catálogo</h1>
                    <button id="btn-pagar-test" style="padding:12px 20px;background:#eab308;color:#1e293b;border:none;border-radius:12px;font-weight:bold;cursor:pointer;display:flex;align-items:center;gap:8px;">
                        <i class="fa-solid fa-credit-card"></i> Pagar Carrito
                    </button>
                </header>
                <div class="barra-busqueda">
                    <i class="fa-solid fa-magnifying-glass icono-busqueda"></i>
                    <input type="text" class="campo-busqueda" placeholder="Buscar producto...">
                </div>
                <nav class="filtros-categorias">
                    <button class="boton-filtro activo">Whey Protein</button>
                    <button class="boton-filtro">Pre-workout</button>
                    <button class="boton-filtro">Creatine</button>
                </nav>
                <section class="banner-promocional">
                    <div class="contenido-banner">
                        <h2 class="titulo-banner">Nuevos Llegados</h2>
                        <p class="texto-banner">Suplementos con formulas de alta calidad.</p>
                    </div>
                </section>
                <section class="cuadricula-productos"></section>
            </div>
        </main>
    </div>
    <div id="modal-carrito" class="modal-carrito-oculto">
        <div class="contenido-modal">
            <div class="cabecera-modal">
                <h2><i class="fa-solid fa-cart-shopping"></i> Tu Carrito</h2>
                <button id="boton-cerrar-carrito" class="boton-cerrar">&times;</button>
            </div>
            <div class="cuerpo-modal">
                <table class="tabla-carrito">
                    <thead><tr><th>Producto</th><th>Precio</th><th>Cantidad</th><th>Subtotal</th><th>Acciones</th></tr></thead>
                    <tbody id="contenedor-items-carrito"></tbody>
                </table>
            </div>
            <div class="pie-modal">
                <div class="bloque-totales">
                    <p>Subtotal Neto: <span id="total-neto">$0.00</span></p>
                    <p>IVA (16%): <span id="total-iva">$0.00</span></p>
                    <hr>
                    <p class="gran-total">Total a Pagar: <span id="gran-total">$0.00</span></p>
                </div>
                <div class="botones-globales">
                    <button id="boton-vaciar-carrito" class="btn-app btn-secundario">
                        <i class="fa-solid fa-trash-can"></i> Vaciar
                    </button>
                    <button id="boton-proceder-pago" class="btn-app btn-primario">
                        <i class="fa-solid fa-credit-card"></i> Proceder al Pago
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="/helpers/persistenciaCliente.js"></script>
    <script src="/logica/producto/GestorProductos.js"></script>
    <script src="/logica/pedidos/PedidosModel.js"></script>
    <script src="/logica/pedidos/PedidosController.js"></script>
    <script src="/logica/pedidos/checkout.js"></script>

    <script src="/logica/carrito/CarritoModel.js"></script>
    <script src="/logica/carrito/CarritoController.js"></script>

    <script src="/logica/producto/catalogo.js"></script>
    <script src="/elementosJS/sidebarController.js"></script>
    <script>
        document.getElementById('btn-cerrar-sesion')?.addEventListener('click', async (e) => {
            e.preventDefault();
            const p = new PersistenciaCliente();
            // En lugar de null, mandamos un objeto vacío válido para JSON
            await p.escribirArchivo('sesion.json', {}); 
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
